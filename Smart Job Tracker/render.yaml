services:
  - type: web
    name: job-tracker-api
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python -m alembic stamp head
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        value: 95fe543b49460b6ef4a1b26e28ddcb025f401a7aef0aa5efe624e6471e078ac0
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 30
      - key: DEFAULT_PAGE_SIZE
        value: 20
      - key: MAX_PAGE_SIZE
        value: 100
      - key: DATABASE_URL
        sync: false
        # Set in Render Dashboard: postgresql://postgres:[PASSWORD]@db.rdmputvjdcfotqdxmtum.supabase.co:5432/postgres
      - key: FRONTEND_URL
        value: https://job-tracker-frontend-sxro.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0
